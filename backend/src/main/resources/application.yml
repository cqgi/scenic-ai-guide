server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: scenic-ai-guide
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scenic_ai}
    username: ${DB_USERNAME:scenic}
    password: ${DB_PASSWORD:scenic_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
    expires-in-minutes: ${JWT_EXPIRES_IN_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  rag:
    embedding-provider: ${RAG_EMBEDDING_PROVIDER:HASH}
    max-top-k: ${RAG_MAX_TOP_K:50}
    max-top-n: ${RAG_MAX_TOP_N:10}
    min-keyword-score-for-fusion: ${RAG_MIN_KEYWORD_SCORE_FOR_FUSION:3.0}
    min-vector-score-for-fusion: ${RAG_MIN_VECTOR_SCORE_FOR_FUSION:0.18}
  ai:
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
    tts-model: ${OPENAI_TTS_MODEL:tts-1}
    tts-voice: ${OPENAI_TTS_VOICE:alloy}
    asr-model: ${OPENAI_ASR_MODEL:whisper-1}
    audio-storage-path: ${AI_AUDIO_STORAGE_PATH:target/generated-audio}
    audio-public-path: ${AI_AUDIO_PUBLIC_PATH:/generated-audio}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
