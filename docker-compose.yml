services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scenic-ai-postgres
    environment:
      POSTGRES_DB: scenic_ai
      POSTGRES_USER: scenic
      POSTGRES_PASSWORD: scenic_pass
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - scenic_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenic -d scenic_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scenic_ai_pgdata:
